server {
    server_name ciloglu.vapur-it.de;
    client_max_body_size 25m;

    # Übergangsschutz per Basic-Auth, bis das App-Login (Phase 4) scharf ist.
    # Nach Aktivierung des App-Logins können diese zwei Zeilen entfernt werden.
    auth_basic "Ciloglu Rechnungspruefer";
    auth_basic_user_file /etc/nginx/.htpasswd-ciloglu;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ciloglu.vapur-it.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ciloglu.vapur-it.de/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = ciloglu.vapur-it.de) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name ciloglu.vapur-it.de;
    return 404; # managed by Certbot
}
